name: Stage Piper Amy model once (review branch)

on:
  push:
    branches:
      - feat/piper-amy-pypi-review
    paths:
      - .github/workflows/stage-amy-model-once.yml

permissions:
  contents: write

jobs:
  stage-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download from pinned Piper collection and verify 63MB model
        run: |
          python scripts/package_piper_voices.py \
            --voice en_US-amy-low \
            --models-dir voice_assets \
            --download
          python - <<'PY'
          import hashlib
          from pathlib import Path
          base = Path('voice_assets/en_US-amy-low')
          model = base / 'en_US-amy-low.onnx'
          assert model.stat().st_size == 63104526
          expected = 'a5a91abb7de0f104358a25aded480ddacf1ff0762886325886ec406a2e86aab3'
          assert hashlib.sha256(model.read_bytes()).hexdigest() == expected
          assert (base / 'en_US-amy-low.onnx.json').stat().st_size == 4164
          assert (base / 'en_US-amy-low.MODEL_CARD').stat().st_size == 273
          print('Verified Piper Amy low model, JSON and MODEL_CARD')
          PY
      - name: Commit exact model weights and metadata to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f voice_assets/en_US-amy-low/en_US-amy-low.onnx
          git add -f voice_assets/en_US-amy-low/en_US-amy-low.onnx.json
          git add voice_assets/en_US-amy-low/en_US-amy-low.MODEL_CARD
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add verified Piper Amy low voice weights for release review [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
