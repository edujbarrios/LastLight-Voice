name: Stage small offline English Vosk model once

on:
  push:
    branches: [feat/offline-voice-interaction]
    paths: [.github/workflows/stage-vosk-once.yml]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify upstream Vosk English model
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, stat, urllib.request, zipfile

          url = 'https://huggingface.co/rhasspy/vosk-models/resolve/main/en/vosk-model-small-en-us-0.15.zip'
          expected = '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498'
          path = Path('/tmp/vosk-model-small-en-us-0.15.zip')
          request = urllib.request.Request(url, headers={'User-Agent': 'LastLight-Voice-model-packager/1.0'})
          with urllib.request.urlopen(request, timeout=180) as src, path.open('wb') as dst:
              while chunk := src.read(1024 * 1024):
                  dst.write(chunk)
          digest = hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
          assert digest == expected, f'Unexpected Vosk archive digest: {digest}'
          assert 38_000_000 < path.stat().st_size < 45_000_000
          with zipfile.ZipFile(path) as archive:
              members = archive.infolist()
              assert len(members) < 200
              total = sum(f.file_size for f in members)
              assert total < 220_000_000
              root = 'vosk-model-small-en-us-0.15/'
              assert all(f.filename.startswith(root) for f in members)
              for f in members:
                  assert '..' not in Path(f.filename).parts and not f.filename.startswith('/')
                  assert not stat.S_ISLNK(f.external_attr >> 16)
              destination = Path('src/lastlight_voice/stt_models')
              archive.extractall(destination)
          model = Path('src/lastlight_voice/stt_models/vosk-model-small-en-us-0.15')
          for required in ['am/final.mdl', 'conf/model.conf', 'graph/HCLr.fst', 'graph/Gr.fst']:
              assert (model / required).is_file(), f'Missing Vosk model component {required}'
          print('STAGED verified Vosk model:', len(members), 'files;', total, 'bytes uncompressed')
          PY
      - name: Commit verified model to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f src/lastlight_voice/stt_models/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: bundle verified Apache-2.0 Vosk English STT model [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
