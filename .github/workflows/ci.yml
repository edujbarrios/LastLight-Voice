name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Test optional upstream LastLight 0.3.1 public API
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install "lastlight==0.3.1"
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from lastlight import LastLight
          from lastlight_voice.integrations import make_lastlight_responder

          pack = Path("/tmp/lastlight-example-en.zip")
          url = "https://raw.githubusercontent.com/edujbarrios/lastlight/main/examplepack/lastlight-example-en.zip"
          with urlopen(url, timeout=45) as response:
              pack.write_bytes(response.read())
          knowledge = LastLight(pack)
          respond = make_lastlight_responder(knowledge)
          question = (
              "The power has been out for several hours. "
              "How long will food stay safe in my refrigerator if I keep the door closed?"
          )
          result = knowledge.query(question)
          assert result.accepted and result.passage, result
          assert respond(question) == result.passage.strip()
          unknown = "How do I repair a diesel engine that will not start?"
          assert not knowledge.query(unknown).accepted
          assert "don't have enough reliable local knowledge" in respond(unknown)
          print("Original LastLight public QueryResult contract OK")
          PY
      - name: Smoke test CLI
        run: |
          lastlight-voice doctor
          lastlight-voice inspect
          lastlight-voice speak --backend dummy "offline smoke test"
          lastlight-voice synthesize --backend dummy "offline smoke test" smoke.wav
          test -s smoke.wav
          lastlight-voice voices --backend piper --language en
          lastlight-voice synthesize --language en "LastLight works offline." smoke-piper.wav
          test -s smoke-piper.wav
      - name: Check bundled STT model can transcribe local synthetic speech
        run: |
          lastlight-voice synthesize --language en "Hello, I have received your message. Knowledge remains available offline." stt-example.wav
          python - <<'PY'
          import json
          import wave
          from vosk import Model, KaldiRecognizer
          from lastlight_voice import VoskTranscriber
          stt = VoskTranscriber()
          assert stt.model_available()
          with wave.open("stt-example.wav", "rb") as wav:
              assert wav.getnchannels() == 1 and wav.getsampwidth() == 2
              rec = KaldiRecognizer(Model(str(stt.model_dir)), wav.getframerate())
              while frames := wav.readframes(4000):
                  rec.AcceptWaveform(frames)
              text = json.loads(rec.FinalResult()).get("text", "")
          print("Offline Vosk recognizer heard:", repr(text))
          assert text.strip(), "Offline recognizer could not decode Piper-generated local speech"
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Check wheel contains original Piper voice files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("lastlight_voice-*.whl"))
          root = "lastlight_voice/voices/en_US-amy-low/"
          with ZipFile(wheel) as archive:
              assert archive.getinfo(root + "en_US-amy-low.onnx").file_size == 63104526
              assert archive.getinfo(root + "en_US-amy-low.onnx.json").file_size == 4164
              assert archive.getinfo(root + "en_US-amy-low.MODEL_CARD").file_size == 273
              assert archive.getinfo("lastlight_voice/voices/THIRD_PARTY_VOICES.md").file_size > 0
          print("Verified Amy ONNX, JSON, MODEL_CARD and attribution inside wheel")
          PY
      - name: Check Vosk STT model and Apache attribution in wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("lastlight_voice-*.whl"))
          root = "lastlight_voice/stt_models/vosk-model-small-en-us-0.15/"
          with ZipFile(wheel) as archive:
              for item in ("am/final.mdl", "graph/HCLr.fst", "graph/Gr.fst", "conf/model.conf"):
                  assert archive.getinfo(root + item).file_size > 0, item
              assert archive.getinfo("lastlight_voice/stt_models/APACHE-2.0.txt").file_size > 9000
              assert archive.getinfo("lastlight_voice/stt_catalog.json").file_size > 0
              assert archive.getinfo("lastlight_voice/stt_models/THIRD_PARTY_STT.md").file_size > 0
          print(f"Wheel archive: {wheel.stat().st_size:,} bytes")
          print("Verified bundled Vosk STT model and Apache-2.0 attribution")
          PY
      - name: Install built wheel in isolated venv and synthesize with Piper
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install dist/lastlight_voice-0.1.0-*.whl
          (cd /tmp && "$GITHUB_WORKSPACE/.wheel-test/bin/lastlight-voice" synthesize --language en "Bundled voice works offline." "$GITHUB_WORKSPACE/wheel-test.wav")
          test -s wheel-test.wav
          (cd /tmp && "$GITHUB_WORKSPACE/.wheel-test/bin/python" -c "from lastlight_voice import VoskTranscriber; assert VoskTranscriber().model_available(); print('Bundled offline STT model available from clean wheel')")
